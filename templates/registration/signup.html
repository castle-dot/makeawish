{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 80px auto; padding: 40px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--wood); border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);">
    
    <h2 style="text-align: center; color: var(--faded-gold); font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 30px; font-style: italic;">
        Create Account
    </h2>

    <form method="post" enctype="multipart/form-data" class="vintage-form">
        {% csrf_token %}
        
        <style>
            /* This targets the Django form labels and inputs specifically */
            .vintage-form p {
                margin-bottom: 20px;
                color: var(--faded-gold);
            }
            .vintage-form input {
                width: 100%;
                padding: 12px;
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid var(--wood);
                border-radius: 6px;
                color: white;
                font-family: 'Crimson Text', serif;
                font-size: 1.1rem;
                margin-top: 5px;
                box-sizing: border-box; /* Ensures padding doesn't break width */
            }
            .vintage-form input:focus {
                outline: none;
                border-color: var(--faded-gold);
                background: rgba(255, 255, 255, 0.05);
            }
            .vintage-form .helptext {
                display: block;
                font-size: 0.85rem;
                opacity: 0.6;
                margin-top: 5px;
                color: var(--parchment);
            }
        </style>

        {{ form.as_p }}

        <button type="submit" class="btn" style="width:100%; padding:15px; font-size:1.3rem; margin-top: 20px; border-radius: 8px;">
            Sign Up
        </button>
    </form>

    <div style="text-align:center; margin-top:30px; padding-top: 20px; border-top: 1px solid var(--wood);">
        <p style="color: var(--parchment); opacity: 0.8;">
            Already have an account? <a href="{% url 'accounts:login' %}" style="color: var(--faded-gold); font-weight: bold;">Log in</a>
        </p>
    </div>
</div>

<div style="margin-top: 150px;"></div>
{% endblock %}
