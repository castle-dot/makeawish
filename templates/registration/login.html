{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>

{% if form.errors %}
    <p style="color:red;">Invalid username or password.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <p>
        {{ form.username.label_tag }}<br>
        {{ form.username }}
    </p>
    <p>
        {{ form.password.label_tag }}<br>
        {{ form.password }}
    </p>
    <button type="submit">Log In</button>
</form>

<p><a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
