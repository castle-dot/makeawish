{% extends 'base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 100px auto; padding: 40px; background: rgba(255,255,255,0.03); border: 1px solid var(--wood); border-radius: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4);">
    
    <h2 style="color: var(--faded-gold); font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 20px;">
        Delete Comment?
    </h2>
    
    <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border-left: 3px solid #fb4934; margin-bottom: 30px; text-align: left;">
        <p style="color: var(--parchment); font-size: 1.1rem; line-height: 1.6; margin: 0;">
            <span style="opacity: 0.5; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 5px;">Comment Content:</span>
            "{{ comment.content|truncatewords:20 }}"
        </p>
    </div>
    
    <p style="color: var(--parchment); opacity: 0.6; margin-bottom: 40px;">
        This action is permanent and cannot be undone.
    </p>
    
    <form method="post" style="display: flex; gap: 15px; justify-content: center;">
        {% csrf_token %}
        
        <a href="{% url 'wishes:detail' comment.wish.pk %}" 
           style="background: transparent; color: var(--parchment); padding: 12px 30px; border: 1px solid var(--wood); border-radius: 8px; text-decoration: none; font-size: 1rem; transition: 0.3s; opacity: 0.8;">
            Cancel
        </a>

        <button type="submit" 
                style="background: #fb4934; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 73, 52, 0.2);">
            Yes, Delete Comment
        </button>
    </form>
</div>

<p style="text-align: center; margin-top: 30px;">
    <a href="{% url 'wishes:detail' comment.wish.pk %}" style="text-decoration: none; color: var(--faded-gold); opacity: 0.5; font-size: 0.9rem;">
        ← Back to Wish
    </a>
</p>
{% endblock %}
