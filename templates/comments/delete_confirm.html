{% extends 'base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 50px auto; padding: 30px; background: #fffef5; border: 2px solid #d2b48c; border-radius: 12px; text-align: center;">
    <h2 style="color: #5c2d0d; margin-bottom: 20px;">Delete Comment</h2>
    
    <p style="font-size: 1.2rem; margin-bottom: 30px;">
        Are you sure you want to delete this comment?<br>
        <em>"{{ comment.content|truncatewords:20 }}"</em>
    </p>
    
    <p style="color: #777; margin-bottom: 40px;">
        This action cannot be undone.
    </p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc3545; color:white; padding:14px 40px; border:none; border-radius:8px; font-size:1.3rem; cursor:pointer; margin-right:20px;">
            Yes, Delete
        </button>
        <a href="{% url 'wishes:detail' comment.wish.pk %}" style="background:#6c757d; color:white; padding:14px 40px; border-radius:8px; text-decoration:none; font-size:1.3rem;">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
