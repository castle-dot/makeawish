{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 30px; background: #fffef5; border: 2px solid #d2b48c; border-radius: 12px;">
    <h2 style="text-align: center; color: #5c2d0d;">Create Account</h2>

    <form method="post" enctype="multipart/form-data">  <!-- keep enctype, no harm -->
        {% csrf_token %}
        {{ form.as_p }}  <!-- this will show the URL field with correct label/help -->
        <button type="submit" class="btn" style="width:100%; padding:14px; font-size:1.3rem;">Sign Up</button>
    </form>

    <p style="text-align:center; margin-top:20px;">
        Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
    </p>
</div>
{% endblock %}
